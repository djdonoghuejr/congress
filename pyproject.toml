[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "congress-trades-mvp"
version = "0.1.0"
description = "MVP backend for ingesting official congressional securities trade disclosures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.1,<2.0.0",
  "beautifulsoup4>=4.13.3,<5.0.0",
  "fastapi>=0.115.11,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "lxml>=5.3.1,<6.0.0",
  "openai-agents>=0.2.0,<1.0.0",
  "psycopg[binary]>=3.2.6,<4.0.0",
  "pydantic-settings>=2.8.1,<3.0.0",
  "pydantic>=2.10.6,<3.0.0",
  "pypdf>=5.4.0,<6.0.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "sqlalchemy>=2.0.39,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<9.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires an OpenAI API key and a configured research database",
]

[tool.setuptools.packages.find]
include = ["app*"]
